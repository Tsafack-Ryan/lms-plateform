<div class="dashboard-etudiant">
    <div class="header-dashboard-etudiant">
        <h1>Bonjour, <span id="nom-etudiant">Etudiant</span> !</h1>
        <p>Ravi de vous revoir. Voici un apercu de votre progression.</p>
    </div>

    <div class="stats-etudiant">
        <div class="carte-stat-etudiant">
            <span class="icone-stat-etudiant">CO</span>
            <div class="details-stat-etudiant">
                <h3 id="nbr-cours">0</h3>
                <p>Cours en cours</p>
            </div>
        </div>
        <div class="carte-stat-etudiant">
            <span class="icone-stat-etudiant">LT</span>
            <div class="details-stat-etudiant">
                <h3 id="nbr-cours-fini">0</h3>
                <p>Lecons terminees</p>
            </div>
        </div>
        <div class="carte-stat-etudiant">
            <span class="icone-stat-etudiant">QR</span>
            <div class="details-stat-etudiant">
                <h3 id="nbr-quiz-reussis">0</h3>
                <p>Quiz reussis</p>
            </div>
        </div>
    </div>

    <div class="gbl-progression-card">
        <h2>Votre progression generale</h2>
        <div class="conteneur-barre-progression">
            <span id="pourcentage-progression">0%</span>
        </div>
    </div>

    <div class="zone-cours-actifs">
        <h2>Continuer l'apprentissage</h2>
        <div id="liste-cours-actifs" class="grille-cours">
            <p class="message-vide" id="message-aucun-cours">
                Vous n'etes inscrit a aucun cours. Visitez le <a href="#catalogue">catalogue</a> pour commencer.
            </p>
        </div>
    </div>
</div>
