<div class="conteneur-connexion">
    <div class="carte-connexion" id="connexion-box">
        <div class="connexion-header">
            <span class="badge-plateforme">STARACADEMY</span>
            <h2>Connexion a la plateforme</h2>
            <p>Choisissez votre espace puis connectez-vous pour continuer.</p>
        </div>
        <form id="formulaire-connexion">
            <div class="choix-role" role="group" aria-label="Type de compte">
                <label class="option-role">
                    <input type="radio" name="role" value="etudiant" checked>
                    <span>Etudiant</span>
                </label>
                <label class="option-role">
                    <input type="radio" name="role" value="enseignant">
                    <span>Enseignant</span>
                </label>
                <label class="option-role">
                    <input type="radio" name="role" value="promoteur">
                    <span>Promoteur</span>
                </label>
            </div>
            <div class="groupe-saisie">
                <label for="saisie-email">Adresse email</label>
                <input type="email" id="saisie-email" name="email" placeholder="exemple@email.com" required>
            </div>
            <div class="groupe-saisie">
                <label for="saisie-mot-passe">Mot de passe</label>
                <div class="mot-passe-conteneur">
                    <input type="password" id="saisie-mot-passe" name="mot_de_passe"
                        placeholder="Entrez votre mot de passe..." required>
                    <button type="button" class="btn-basculer-mot-passe"
                        onclick="basculerMotPasse('saisie-mot-passe', this)" tabindex="-1"
                        aria-label="Afficher ou masquer le mot de passe">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" id="btn-connexion">Acceder a mon espace</button>
        </form>
        <div class="pied-connexion">
            <p>Pas encore de compte ? <a href="#" id="inscription-link">Creer un compte</a></p>
        </div>
    </div>

    <div class="carte-connexion masque" id="boite-inscription">
        <div class="connexion-header">
            <span class="badge-plateforme">STARACADEMY — Inscription</span>
            <h2>Creer un compte</h2>
            <p>Rejoignez-nous pour commencer votre parcours d'apprentissage.</p>
        </div>
        <form id="formulaire-inscription">
            <div class="choix-role" role="group" aria-label="Type de compte">
                <label class="option-role">
                    <input type="radio" name="role" value="etudiant" checked>
                    <span>Etudiant</span>
                </label>
                <label class="option-role">
                    <input type="radio" name="role" value="enseignant">
                    <span>Enseignant</span>
                </label>
            </div>
            <div class="groupe-saisie">
                <label for="saisie-nom-inscription">Votre nom complet</label>
                <input type="text" id="saisie-nom-inscription" name="nom" placeholder="Entrez votre nom complet..."
                    required>
            </div>
            <div class="groupe-saisie">
                <label for="saisie-email-inscription">Adresse email</label>
                <input type="email" id="saisie-email-inscription" name="email" placeholder="exemple@email.com" required>
            </div>
            <div class="groupe-saisie">
                <label for="saisie-password-inscription">Mot de passe</label>
                <div class="mot-passe-conteneur">
                    <input type="password" id="saisie-password-inscription" name="mot_de_passe"
                        placeholder="Creez un mot de passe..." required>
                    <button type="button" class="btn-basculer-mot-passe"
                        onclick="basculerMotPasse('saisie-password-inscription', this)" tabindex="-1"
                        aria-label="Afficher ou masquer le mot de passe">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" id="bouton-inscription">S'inscrire et commencer</button>
        </form>
        <div class="footer-connexion">
            <p>Vous avez deja un compte ? <a href="#" id="connexion-link">Connectez-vous</a></p>
        </div>
    </div>
</div>
