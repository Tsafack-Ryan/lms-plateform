<div class="conteneur-lecon">
    <div class="header-formulaire">
        <h1>Ajouter une lecon</h1>
        <p>Chaque lecon peut etre un document PDF ou une video.</p>
    </div>

    <form id="formulaire-lecon" class="formulaire-lecon">
        <div class="groupe-saisie">
            <label for="cours-lecon">Cours associe</label>
            <select id="cours-lecon" name="cours_id" required>
                <option value="">Selectionner un cours</option>
            </select>
        </div>

        <div class="groupe-saisie">
            <label for="titre-lecon">Titre de la lecon</label>
            <input type="text" id="titre-lecon" name="titre" placeholder="Ex: Les balises HTML de base" required>
        </div>

        <div class="groupe-saisie">
            <label for="type-contenu">Type de contenu</label>
            <select id="type-contenu" name="type_contenu" required>
                <option value="">Choisir un type</option>
                <option value="pdf">Document PDF</option>
                <option value="video">Video</option>
            </select>
        </div>

        <div class="groupe-saisie">
            <label for="fichier-lecon">Fichier de la lecon</label>
            <input type="file" id="fichier-lecon" name="fichier" accept=".pdf,video/*" required>
        </div>

        <div class="groupe-saisie">
            <label for="ordre-lecon">Ordre de la lecon</label>
            <input type="number" id="ordre-lecon" name="ordre" min="1" required>
        </div>

        <div class="actions-formulaire">
            <button type="submit">Ajouter la lecon</button>
            <button type="button" class="btn-secondaire">Annuler</button>
        </div>
    </form>

    <section class="liste-enseignant">
        <h2>Lecons publiees</h2>
        <div id="liste-lecons-enseignant" class="tableau-simple">
            <p class="message-vide">Aucune lecon ajoutee pour le moment.</p>
        </div>
    </section>
</div>
